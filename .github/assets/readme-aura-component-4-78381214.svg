<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00e5ff"/><stop offset="34%" stop-color="#111122"/>
    <stop offset="58%" stop-color="#8b5cf6"/><stop offset="82%" stop-color="#111122"/><stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>
  <radialGradient id="orbC"><stop offset="0%" stop-color="#00e5ff" stop-opacity=".38"/><stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbP"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop offset="0%" stop-color="#3366ff" stop-opacity=".30"/><stop offset="100%" stop-color="#3366ff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="4"/></filter>
  <style><![CDATA[
    @keyframes driftA {0%,100%{transform:translate(0,0);opacity:.58}50%{transform:translate(38px,-24px);opacity:.88}}
    @keyframes driftB {0%,100%{transform:translate(0,0);opacity:.46}50%{transform:translate(-32px,20px);opacity:.78}}
    @keyframes pulse {0%,100%{opacity:.48}50%{opacity:1}}
    @keyframes scan {0%{transform:translateY(-360px)}100%{transform:translateY(360px)}}
    @keyframes blink {0%,49%{opacity:1}50%,100%{opacity:0}}
    .a{animation:driftA 10s ease-in-out infinite} .b{animation:driftB 12s ease-in-out infinite .6s}
    .p{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 7s linear infinite} .blink{animation:blink 1.05s step-end infinite}
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
  ]]></style>
</defs>
<rect x="0" y="0" width="860" height="220" rx="20" fill="#06060a"/>
<rect x="1" y="1" width="858" height="218" rx="19" fill="none" stroke="#00e5ff" stroke-opacity=".10"/>
<ellipse class="a" cx="72" cy="196" rx="190" ry="105" fill="url(#orbC)" filter="url(#blur)"/><ellipse class="b" cx="755" cy="42" rx="210" ry="120" fill="url(#orbP)" filter="url(#blur)"/>
<text x="430" y="43" text-anchor="middle" fill="#8b9dc3" font-size="11" font-weight="700" letter-spacing="6">CURRENT FOCUS</text><g class="p" style="animation-delay:0.0s"><rect x="120" y="92" width="188" height="34" rx="10" fill="#0a0a12" stroke="#00e5ff" stroke-opacity=".22"/><circle cx="137" cy="109" r="4" fill="#00e5ff"/><text x="151" y="113" fill="#c0c8e0" font-size="10.6" font-weight="600">Machine Learning</text></g><g class="p" style="animation-delay:0.3s"><rect x="336" y="92" width="188" height="34" rx="10" fill="#0a0a12" stroke="#8b5cf6" stroke-opacity=".22"/><circle cx="353" cy="109" r="4" fill="#8b5cf6"/><text x="367" y="113" fill="#c0c8e0" font-size="10.6" font-weight="600">NLP</text></g><g class="p" style="animation-delay:0.6s"><rect x="552" y="92" width="188" height="34" rx="10" fill="#0a0a12" stroke="#3366ff" stroke-opacity=".22"/><circle cx="569" cy="109" r="4" fill="#3366ff"/><text x="583" y="113" fill="#c0c8e0" font-size="10.6" font-weight="600">Algorithms</text></g><g class="p" style="animation-delay:0.8999999999999999s"><rect x="120" y="145" width="188" height="34" rx="10" fill="#0a0a12" stroke="#ec4899" stroke-opacity=".22"/><circle cx="137" cy="162" r="4" fill="#ec4899"/><text x="151" y="166" fill="#c0c8e0" font-size="10.6" font-weight="600">Software Development</text></g><g class="p" style="animation-delay:1.2s"><rect x="336" y="145" width="188" height="34" rx="10" fill="#0a0a12" stroke="#54a6ff" stroke-opacity=".22"/><circle cx="353" cy="162" r="4" fill="#54a6ff"/><text x="367" y="166" fill="#c0c8e0" font-size="10.6" font-weight="600">Data Preprocessing</text></g><g class="p" style="animation-delay:1.5s"><rect x="552" y="145" width="188" height="34" rx="10" fill="#0a0a12" stroke="#c084fc" stroke-opacity=".22"/><circle cx="569" cy="162" r="4" fill="#c084fc"/><text x="583" y="166" fill="#c0c8e0" font-size="10.6" font-weight="600">Classification</text></g>
</svg>