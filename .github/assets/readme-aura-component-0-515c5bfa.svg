<svg width="860" height="320" viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00e5ff"/><stop offset="34%" stop-color="#111122"/>
    <stop offset="58%" stop-color="#8b5cf6"/><stop offset="82%" stop-color="#111122"/><stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>
  <radialGradient id="orbC"><stop offset="0%" stop-color="#00e5ff" stop-opacity=".38"/><stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbP"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop offset="0%" stop-color="#3366ff" stop-opacity=".30"/><stop offset="100%" stop-color="#3366ff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="4"/></filter>
  <style><![CDATA[
    @keyframes driftA {0%,100%{transform:translate(0,0);opacity:.58}50%{transform:translate(38px,-24px);opacity:.88}}
    @keyframes driftB {0%,100%{transform:translate(0,0);opacity:.46}50%{transform:translate(-32px,20px);opacity:.78}}
    @keyframes pulse {0%,100%{opacity:.48}50%{opacity:1}}
    @keyframes scan {0%{transform:translateY(-360px)}100%{transform:translateY(360px)}}
    @keyframes blink {0%,49%{opacity:1}50%,100%{opacity:0}}
    .a{animation:driftA 10s ease-in-out infinite} .b{animation:driftB 12s ease-in-out infinite .6s}
    .p{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 7s linear infinite} .blink{animation:blink 1.05s step-end infinite}
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
  ]]></style>
</defs>
<rect x="0" y="0" width="860" height="320" rx="20" fill="#06060a"/>
<rect x="1" y="1" width="858" height="318" rx="19" fill="none" stroke="#00e5ff" stroke-opacity=".10"/>

<g opacity=".95"><ellipse class="a" cx="118" cy="286" rx="245" ry="150" fill="url(#orbC)" filter="url(#blur)"/>
<ellipse class="b" cx="730" cy="64" rx="220" ry="150" fill="url(#orbP)" filter="url(#blur)"/>
<ellipse class="a" cx="630" cy="298" rx="210" ry="110" fill="url(#orbB)" filter="url(#blur)"/></g>
<g opacity=".13"><circle cx="430" cy="160" r="118" fill="none" stroke="#00e5ff"/><circle cx="430" cy="160" r="151" fill="none" stroke="#8b5cf6"/></g>
<rect class="scan" x="0" y="0" width="860" height="72" fill="url(#orbC)" opacity=".18"/>
<text x="430" y="72" text-anchor="middle" fill="#8b9dc3" font-size="11" font-weight="600" letter-spacing="5">HELLO, I'M</text>
<text x="430" y="133" text-anchor="middle" fill="#f4f7ff" font-size="38" font-weight="800">Norah Alnowfal</text>
<text x="430" y="171" text-anchor="middle" fill="#c0c8e0" font-size="15" font-weight="500">Computer Science  ·  Aspiring AI Engineer</text>
<g transform="translate(108 206)">
  <rect x="0" y="0" width="164" height="28" rx="14" fill="#0a0a12" stroke="#00e5ff" stroke-opacity=".24"/><text x="82" y="18" text-anchor="middle" fill="#00e5ff" font-size="10.5">Artificial Intelligence</text>
  <rect x="176" y="0" width="164" height="28" rx="14" fill="#0a0a12" stroke="#8b5cf6" stroke-opacity=".28"/><text x="258" y="18" text-anchor="middle" fill="#bca7ff" font-size="10.5">Software Development</text>
  <rect x="352" y="0" width="130" height="28" rx="14" fill="#0a0a12" stroke="#3366ff" stroke-opacity=".28"/><text x="417" y="18" text-anchor="middle" fill="#8ea8ff" font-size="10.5">Machine Learning</text>
  <rect x="494" y="0" width="86" height="28" rx="14" fill="#0a0a12" stroke="#ec4899" stroke-opacity=".30"/><text x="537" y="18" text-anchor="middle" fill="#ff9bc3" font-size="10.5">NLP</text>
</g>
<text x="430" y="274" text-anchor="middle" fill="#8b9dc3" font-size="11" letter-spacing="1.4">LEARNING  ·  BUILDING  ·  IMPROVING</text>
<rect class="blink" x="608" y="264" width="7" height="13" rx="1" fill="#00e5ff"/>

</svg>