<svg width="860" height="240" viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00e5ff"/><stop offset="34%" stop-color="#111122"/>
    <stop offset="58%" stop-color="#8b5cf6"/><stop offset="82%" stop-color="#111122"/><stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>
  <radialGradient id="orbC"><stop offset="0%" stop-color="#00e5ff" stop-opacity=".38"/><stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbP"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop offset="0%" stop-color="#3366ff" stop-opacity=".30"/><stop offset="100%" stop-color="#3366ff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="4"/></filter>
  <style><![CDATA[
    @keyframes driftA {0%,100%{transform:translate(0,0);opacity:.58}50%{transform:translate(38px,-24px);opacity:.88}}
    @keyframes driftB {0%,100%{transform:translate(0,0);opacity:.46}50%{transform:translate(-32px,20px);opacity:.78}}
    @keyframes pulse {0%,100%{opacity:.48}50%{opacity:1}}
    @keyframes scan {0%{transform:translateY(-360px)}100%{transform:translateY(360px)}}
    @keyframes blink {0%,49%{opacity:1}50%,100%{opacity:0}}
    .a{animation:driftA 10s ease-in-out infinite} .b{animation:driftB 12s ease-in-out infinite .6s}
    .p{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 7s linear infinite} .blink{animation:blink 1.05s step-end infinite}
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
  ]]></style>
</defs>
<rect x="0" y="0" width="860" height="240" rx="20" fill="#06060a"/>
<rect x="1" y="1" width="858" height="238" rx="19" fill="none" stroke="#00e5ff" stroke-opacity=".10"/>

<ellipse class="a" cx="70" cy="220" rx="200" ry="120" fill="url(#orbC)" filter="url(#blur)"/><ellipse class="b" cx="760" cy="40" rx="220" ry="120" fill="url(#orbP)" filter="url(#blur)"/>
<text x="48" y="38" fill="#8b9dc3" font-size="10" font-weight="700" letter-spacing="5">ABOUT</text>
<rect x="36" y="54" width="788" height="150" rx="14" fill="#0a0a12" fill-opacity=".82" stroke="#1a1a2e"/>
<circle cx="58" cy="72" r="4" fill="#ff5f57"/><circle cx="72" cy="72" r="4" fill="#febc2e"/><circle cx="86" cy="72" r="4" fill="#28c840"/>
<text x="52" y="111" fill="#f4f7ff" font-size="18" font-weight="750">Building skills at the intersection of software development</text>
<text x="52" y="134" fill="#f4f7ff" font-size="18" font-weight="750">and artificial intelligence.</text>
<text x="52" y="164" fill="#8b9dc3" font-size="11.3">Computer Science student focused on algorithms, software development, AI and machine learning.</text>
<text x="52" y="184" fill="#8b9dc3" font-size="11.3">I enjoy building personal programming projects, learning continuously, and collaborating on new ideas.</text>
<text x="52" y="220" fill="#00e5ff" font-size="10.5" font-family="monospace">$ focus --python --java --cpp --ml --nlp</text><rect class="blink" x="350" y="210" width="6" height="12" fill="#00e5ff"/>

</svg>